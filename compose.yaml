# Glitched + PostgreSQL. Everything runs with:
#
#   docker compose run --rm glitched setup        # first time: load threat intel
#   docker compose run --rm glitched doctor
#   docker compose run --rm glitched onboard
#
# The database isn't published to your machine; only the glitched container
# can reach it. Data survives restarts in the named volumes below.

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: glitched
      POSTGRES_PASSWORD: glitched   # only reachable inside this compose network
      POSTGRES_DB: glitched
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glitched -d glitched"]
      interval: 5s
      timeout: 5s
      retries: 10

  glitched:
    build: .
    image: glitched:dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://glitched:glitched@db:5432/glitched
      # Optional keys, passed through from your shell or a .env file next to this file.
      NVD_API_KEY: ${NVD_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - glitched-data:/data   # config, acknowledgement, evidence, dbt cache
      - ./:/work              # your current folder: glitch.yaml profiles, SBOMs
    stdin_open: true
    tty: true

volumes:
  pgdata:
  glitched-data:
