<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="200" viewBox="0 0 1000 200" role="img" aria-label="Glitched: security testing for robots">
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#1c1c24"/>
    </pattern>
    <style>
      .mark { font: 700 92px "Inter", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: -4px; }
      .tag { font: 500 15px ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: 5px; }
    </style>
  </defs>
  <rect width="1000" height="200" rx="14" fill="#09090c"/>
  <rect width="1000" height="200" rx="14" fill="url(#dots)"/>
  <text x="500" y="118" text-anchor="middle" class="mark" fill="#4fd8ec" fill-opacity="0.6" transform="translate(-4 0)">glitched</text>
  <text x="500" y="118" text-anchor="middle" class="mark" fill="#d65cf0" fill-opacity="0.6" transform="translate(4 0)">glitched</text>
  <text x="500" y="118" text-anchor="middle" class="mark" fill="#ececf2">glitched</text>
  <text x="500" y="160" text-anchor="middle" class="tag" fill="#8b8b99">SECURITY TESTING FOR ROBOTS</text>
</svg>
