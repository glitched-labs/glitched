name: Docs site

# Builds docs/ into the docs website and publishes it with GitHub Pages
# (https://docs.glitchedlabs.com), on every push to main that changes it.

on:
  push:
    branches: [main]
    paths: ["docs/**", "src/glitched/docsite.py", "src/glitched/docsite_assets/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Build the site
        run: |
          uv venv && uv pip install -e ".[docs]"
          uv run --no-sync python -m glitched.docsite build --base / --out site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
