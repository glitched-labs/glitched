name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint + unit tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.14"]   # oldest and newest supported
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: uv venv && uv pip install -e ".[charts,docs]"
      - name: Lint
        run: uvx ruff check src tests
      - name: Unit tests
        run: uv run --no-sync python -m unittest discover -s tests -t . -v

  docker:
    # The "Run with Docker" path from the README: the image builds and the CLI starts.
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the CLI image
        run: |
          docker build -t glitched:ci .
          docker run --rm glitched:ci --version
      - name: Runner image has no third-party packages
        run: |
          docker build -f Dockerfile.runner -t glitched-runner:ci .
          docker run --rm glitched-runner:ci --version
          test "$(docker run --rm --entrypoint pip glitched-runner:ci list --format=freeze | grep -v -e '^glitched==' -e '^pip==' | wc -l)" -eq 0

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # gitleaks-action lists a PR's commits to scan them
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scan the whole history, not just the last commit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build wheel
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build
        run: uv build
      - name: Check the wheel contains every tracked package file
        # .gitignore patterns also exclude files from the wheel - this caught
        # the research dbt models going missing once.
        run: |
          python3 - <<'PY'
          import glob, subprocess, zipfile
          tracked = {f.removeprefix("src/") for f in subprocess.check_output(["git", "ls-files", "src/glitched"], text=True).split()}
          wheel = set(zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist())
          missing = sorted(tracked - wheel)
          if missing:
              raise SystemExit("missing from the wheel: " + ", ".join(missing))
          print(f"all {len(tracked)} tracked package files are in the wheel")
          PY
      - name: Check the wheel installs and runs
        run: |
          uv venv /tmp/wheel-check
          VIRTUAL_ENV=/tmp/wheel-check uv pip install dist/*.whl
          /tmp/wheel-check/bin/glitched --help
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  release:
    # Pushing a tag like v0.1.0 publishes a GitHub Release with the wheel.
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, docker, secrets, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
